<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>玩游戏学五十音 · 日语学习站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="假名像雨一样落下，在它落进海里之前选出读音。清音、浊音、拗音、片假名都能练，清完一关天就放晴。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="games">
<header id="site-head"></header>
<main>
<style>
/* 假名雨：舞台 = 一片下雨的天空 + 底部的海；答对的雨滴化成光，接住 30 滴天就放晴 */
.kr-hero{padding-block:32px 18px}
.kr-hero .wrap{display:flex;flex-direction:column;gap:6px}
.kr-wrap{display:flex;flex-direction:column;gap:14px;max-width:880px}
.kr-stage{--sun:.25;--d:66px;position:relative;height:clamp(440px,calc(100vh - 250px),600px);border-radius:var(--r-l);overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.85);box-shadow:0 30px 60px -34px rgba(30,60,140,.55);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
@media (max-width:600px){.kr-stage{--d:58px;height:clamp(380px,calc(100vh - 290px),520px)}}
.kr-sky{position:absolute;inset:0;z-index:-3;transition:opacity 1.2s ease}
.kr-sky.rain{background:linear-gradient(180deg,#56719F 0%,#7790BE 42%,#A9BEDD 78%,#C9D7EC 100%)}
.kr-sky.sun{background:linear-gradient(180deg,#1F64D6 0%,#3D8AF0 34%,#86C2FF 68%,#DCEEFF 100%);opacity:var(--sun)}
.kr-rays{position:absolute;inset:0;z-index:-2;pointer-events:none;opacity:calc(var(--sun) * var(--sun));transition:opacity 1.2s ease;
  background:radial-gradient(30% 34% at 88% -4%,rgba(255,248,214,.95),transparent 70%),conic-gradient(from 160deg at 90% -6%,transparent 0deg,rgba(255,255,255,.22) 6deg,transparent 13deg,rgba(255,255,255,.16) 22deg,transparent 30deg,rgba(255,255,255,.12) 40deg,transparent 48deg)}
.kr-clouds{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(26% 12% at 14% 9%,rgba(255,255,255,.75),transparent 70%),radial-gradient(22% 10% at 32% 5%,rgba(255,255,255,.6),transparent 70%),radial-gradient(30% 12% at 70% 12%,rgba(255,255,255,.55),transparent 70%)}
.kr-rain{position:absolute;inset:-20%;z-index:-1;pointer-events:none;opacity:calc(1 - var(--sun));transition:opacity 1.2s ease;
  background-image:repeating-linear-gradient(104deg,transparent 0 22px,rgba(228,238,255,.5) 22px 23px,transparent 23px 60px);background-size:180px 180px;animation:kr-rain .5s linear infinite}
@keyframes kr-rain{to{background-position:-40px 180px}}
.kr-sea{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:3;pointer-events:none;overflow:hidden}
.kr-sea svg{position:absolute;left:0;bottom:0;width:200%;max-width:none;height:100%;display:block}
.kr-sea svg.w1{animation:kr-wave 9s linear infinite}
.kr-sea svg.w2{animation:kr-wave 6s linear infinite reverse;opacity:.85}
@keyframes kr-wave{to{transform:translateX(-50%)}}
.kr-field{position:absolute;inset:0;z-index:2}
.kr-drop{position:absolute;left:0;top:0;width:var(--d);height:var(--d);will-change:transform;pointer-events:none}
.kr-drop .b{position:absolute;inset:0;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:radial-gradient(circle at 38% 62%,#fff 0%,rgba(232,243,255,.96) 42%,rgba(170,212,255,.9) 100%);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 10px 22px -10px rgba(25,60,150,.65),inset 0 -6px 14px rgba(90,140,230,.22)}
.kr-drop .g{position:relative;display:grid;place-items:center;height:100%;padding-top:14%;font-family:var(--f-mincho);font-weight:700;font-size:calc(var(--d) * .46);line-height:1;color:var(--text)}
.kr-drop.two .g{font-size:calc(var(--d) * .34);letter-spacing:-.02em}
.kr-drop.low .b{box-shadow:0 0 0 3px rgba(243,163,184,.55),0 10px 22px -10px rgba(25,60,150,.65)}
.kr-drop.pop{transition:transform .45s ease-out,opacity .45s ease-out;opacity:0}
.kr-drop.pop .b{background:radial-gradient(circle,#fff,rgba(255,236,190,.95) 50%,rgba(255,205,130,.7));transition:background .2s}
.kr-fx{position:absolute;z-index:4;pointer-events:none;font-weight:700;letter-spacing:.06em;white-space:nowrap;transform:translate(-50%,0);animation:kr-up .9s ease-out forwards}
.kr-fx.hit{color:#fff;text-shadow:0 1px 8px rgba(20,60,140,.6)}
.kr-fx.miss{color:#fff;background:rgba(192,79,117,.86);padding:3px 10px;border-radius:999px;font-family:var(--f-mincho);animation-duration:1.6s}
@keyframes kr-up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-38px)}}
.kr-ring{position:absolute;z-index:3;pointer-events:none;width:var(--d);height:var(--d);border-radius:50%;border:2px solid rgba(255,240,200,.95);box-shadow:0 0 18px rgba(255,220,150,.9);animation:kr-ring .5s ease-out forwards}
@keyframes kr-ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.9);opacity:0}}
.kr-hud{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;pointer-events:none}
.kr-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:5px 12px;font-size:.8125rem;color:var(--text-2);letter-spacing:.04em;box-shadow:0 6px 16px -10px rgba(20,50,120,.5)}
.kr-pill b{color:var(--text);font-size:1rem;font-variant-numeric:tabular-nums}
.kr-prog{flex:1;min-width:120px}
.kr-prog .bar{flex:1;height:5px;border-radius:999px;background:rgba(27,35,66,.1);overflow:hidden}
.kr-prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--rose),var(--gold));border-radius:999px;transition:width .3s}
.kr-lives{display:flex;gap:4px}
.kr-lives i{width:11px;height:11px;border-radius:50%;background:#3D7BE0;box-shadow:inset 0 -2px 3px rgba(0,0,0,.15)}
.kr-lives i.off{background:rgba(27,35,66,.15);box-shadow:none}
.kr-combo{position:absolute;left:50%;top:64px;z-index:5;transform:translateX(-50%);font-family:var(--f-mincho);font-weight:900;font-size:1.375rem;color:#fff;text-shadow:0 2px 12px rgba(200,120,30,.75),0 0 2px rgba(150,80,10,.6);letter-spacing:.06em;pointer-events:none;white-space:nowrap}
.kr-combo.bump{animation:kr-bump .3s ease-out}
@keyframes kr-bump{from{transform:translateX(-50%) scale(1.35)}to{transform:translateX(-50%) scale(1)}}
.kr-buffer{position:absolute;left:50%;bottom:68px;z-index:5;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:4px 16px;font-weight:700;font-size:1.125rem;letter-spacing:.12em;min-width:4em;text-align:center;color:var(--text);box-shadow:0 6px 16px -10px rgba(20,50,120,.5)}
.kr-buffer.bad{background:#FFEAF0;color:var(--rose-ink)}
.kr-panel{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(25,45,95,.16)}
.kr-card{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r-l);padding:22px;width:min(520px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 70px -30px rgba(20,40,90,.6)}
@media (max-width:600px){.kr-card{padding:16px;gap:11px}}
.kr-card h2{font-size:1.375rem}
.kr-card .lbl{font-size:.75rem;letter-spacing:.14em;color:var(--text-2);margin:0 0 6px;font-weight:500}
.kr-card .chips{gap:6px}
.kr-card .chip{min-height:40px;display:inline-flex;align-items:center}
.kr-card .chip[disabled]{opacity:.4;cursor:not-allowed}
.kr-best{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.875rem;color:var(--text-2)}
.kr-best b{color:var(--text);font-variant-numeric:tabular-nums}
.kr-go{align-self:stretch;font-size:1.0625rem;padding-block:14px}
.kr-count{font-family:var(--f-mincho);font-weight:900;font-size:clamp(2.5rem,9vw,3.75rem);color:#fff;text-shadow:0 4px 24px rgba(20,50,120,.6);letter-spacing:.08em}
.kr-res-top{display:flex;align-items:center;gap:14px}
.kr-res-top svg{width:64px;height:90px;flex:none}
.kr-res-top h2{font-size:1.5rem}
.kr-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
@media (max-width:420px){.kr-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kr-stats div{background:#F4F7FC;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.kr-stats dt{order:2;font-size:.75rem;color:var(--text-2)}
.kr-stats dd{order:1;margin:0;font-family:var(--f-mincho);font-weight:700;font-size:1.375rem;font-variant-numeric:tabular-nums}
.kr-teru{display:flex;gap:4px;justify-content:center}
.kr-teru svg{width:22px;height:40px}
.kr-kana-list{display:flex;flex-wrap:wrap;gap:6px}
.kr-kana-list button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);min-height:40px}
.kr-kana-list button:hover{border-color:#7DB9FF}
.kr-kana-list button:focus-visible{outline:2px solid var(--gold)}
.kr-kana-list .k{font-family:var(--f-mincho);font-weight:700;font-size:1.25rem}
.kr-kana-list .r{font-size:.75rem;color:var(--text-2);letter-spacing:.06em}
.kr-kana-list .n{font-size:.6875rem;color:var(--rose-ink)}
.kr-pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:600px){.kr-pad{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.kr-key{all:unset;box-sizing:border-box;cursor:pointer;position:relative;text-align:center;min-height:58px;display:grid;place-items:center;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 22px -18px rgba(30,60,140,.6);font-size:1.3125rem;font-weight:700;letter-spacing:.08em;color:var(--text);transition:background .15s,border-color .15s,transform .1s}
.kr-key:hover{border-color:#7DB9FF}
.kr-key:active{transform:scale(.96)}
.kr-key:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kr-key[disabled]{opacity:.45;cursor:default}
.kr-key .kn{position:absolute;top:5px;left:9px;font-size:.625rem;font-weight:500;color:var(--text-2);letter-spacing:0}
.kr-key.ok{background:#E3FAF3;border-color:var(--mint-ink);color:var(--mint-ink)}
.kr-key.no{background:#FFEAF0;border-color:var(--rose-ink);color:var(--rose-ink);animation:kr-shake .3s}
.kr-key.swap{animation:kr-fade .3s ease-out}
@keyframes kr-shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes kr-fade{from{opacity:.2}to{opacity:1}}
.kr-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.kr-bar p{margin:0}
.kr-bar .acts{display:flex;gap:8px}
.kr-demo .kr-drop{animation:kr-bob 4s ease-in-out infinite}
.kr-demo .kr-drop:nth-child(2){animation-delay:-1.3s}.kr-demo .kr-drop:nth-child(3){animation-delay:-2.6s}
@keyframes kr-bob{0%,100%{margin-top:0}50%{margin-top:14px}}
.kr-help{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.kr-help{grid-template-columns:1fr}}
.kr-help ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px;line-height:1.8}
.kr-more{display:flex;flex-wrap:wrap;gap:10px}
/* 页头、舞台、下方卡片同宽对齐 */
.kr-hero .wrap,.kr-low{max-width:880px}
.kr-pad[hidden]{display:none}
.kr-low{display:flex;flex-direction:column;gap:18px}
.kr-low .card{gap:10px}
.kr-help-btn{all:unset;box-sizing:border-box;cursor:pointer;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;color:var(--violet);background:#fff;box-shadow:inset 0 0 0 1px var(--line-strong)}
.kr-help-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kr-sheet-ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px;line-height:1.8}
@media (prefers-reduced-motion: reduce){
  .kr-rain,.kr-sea svg,.kr-demo .kr-drop{animation:none}
  .kr-ring{display:none}
  .kr-fx{animation-duration:.01s}
}
</style>

<section class="page-hero kr-hero">
  <div class="wrap">
    <span class="eyebrow">ゲーム · かなの雨</span>
    <h1>玩游戏学五十音</h1>
    <p class="lead">假名像雨一样落下，在它掉进海里之前选出它的读音。一局 30 滴，接住它们，天就会放晴。</p>
  </div>
</section>

<section class="band" style="padding-top:0">
  <div class="wrap kr-wrap">
    <div class="kr-stage" id="kr-stage">
      <div class="kr-sky rain" aria-hidden="true"></div>
      <div class="kr-sky sun" aria-hidden="true"></div>
      <div class="kr-rays" aria-hidden="true"></div>
      <div class="kr-clouds" aria-hidden="true"></div>
      <div class="kr-rain" aria-hidden="true"></div>

      <div class="kr-hud" id="kr-hud" hidden>
        <span class="kr-pill">得分 <b id="kr-score">0</b></span>
        <span class="kr-pill kr-prog"><span class="bar"><i id="kr-prog"></i></span><b id="kr-count">0 / 30</b></span>
        <span class="kr-pill" aria-label="还能漏掉的雨滴"><span class="kr-lives" id="kr-lives"></span></span>
      </div>
      <div class="kr-combo" id="kr-combo" aria-hidden="true"></div>

      <div class="kr-field" id="kr-field" aria-hidden="true">
        <div class="kr-demo" id="kr-demo"></div>
      </div>
      <div class="kr-buffer" id="kr-buffer" hidden></div>

      <div class="kr-sea" aria-hidden="true">
        <svg class="w2" viewBox="0 0 1200 58" preserveAspectRatio="none"><path fill="#5FA8F0" d="M0 22 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V58 H0z"/></svg>
        <svg class="w1" viewBox="0 0 1200 58" preserveAspectRatio="none"><path fill="#2F78D6" d="M0 30 q50 12 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V58 H0z"/></svg>
      </div>

      <!-- 开始前：选择范围和速度 -->
      <div class="kr-panel" id="kr-setup">
        <div class="kr-card">
          <h2>选一个范围开始</h2>
          <div><p class="lbl">练哪些假名</p><div class="chips" id="kr-modes" role="group" aria-label="练哪些假名"></div></div>
          <div><p class="lbl">雨下得多快</p><div class="chips" id="kr-speeds" role="group" aria-label="速度"></div></div>
          <div class="kr-best"><span id="kr-best-line">这个范围的最高分：<b>0</b></span><span id="kr-plays"></span></div>
          <button class="btn btn-sun kr-go" type="button" id="kr-start">开始下雨</button>
        </div>
      </div>

      <!-- 倒数 -->
      <div class="kr-panel" id="kr-ready" hidden style="background:transparent"><span class="kr-count" id="kr-ready-t">よーい</span></div>

      <!-- 暂停 -->
      <div class="kr-panel" id="kr-pause" hidden>
        <div class="kr-card" style="align-items:center;text-align:center">
          <h2>暂停中</h2>
          <p class="muted" style="margin:0">雨停在半空中了。准备好就继续。</p>
          <div class="hero-cta" style="justify-content:center"><button class="btn btn-sun" type="button" id="kr-resume">继续</button><button class="btn btn-ghost" type="button" id="kr-quit">结束这一局</button></div>
        </div>
      </div>

      <!-- 结算 -->
      <div class="kr-panel" id="kr-result" hidden>
        <div class="kr-card" id="kr-result-card"></div>
      </div>
    </div>

    <div class="kr-pad" id="kr-pad" role="group" aria-label="选择读音" hidden></div>

    <div class="kr-bar">
      <p class="muted small">点读音按钮，接住离海面最近的那一滴。电脑上可以直接打字（<b>shi</b>/<b>si</b> 都算对），Esc 暂停。</p>
      <div class="acts">
        <button class="kr-help-btn" type="button" id="kr-help" aria-label="怎么玩" title="怎么玩">?</button>
        <button class="btn btn-ghost btn-small" type="button" id="kr-sound" aria-pressed="true">声音：开</button>
        <button class="btn btn-ghost btn-small" type="button" id="kr-pausebtn" disabled>暂停</button>
      </div>
    </div>
  </div>
</section>

<section class="band white" style="padding-top:36px">
  <div class="wrap kr-low">
    <article class="card sun">
      <span class="eyebrow">にがてなかな</span>
      <h3>你常漏掉的假名</h3>
      <p class="muted small" style="margin:0">点一下听发音。漏掉的假名攒到 6 个，就可以选「专练常错」只练它们。</p>
      <div class="kr-kana-list" id="kr-weak"></div>
    </article>
    <div class="kr-more">
      <a class="btn btn-ghost btn-small" href="kana.html">五十音表 · 点读发音</a>
      <a class="btn btn-ghost btn-small" href="games.html">← 更多小游戏</a>
    </div>
  </div>
</section>
<template id="kr-howto">
  <ol class="kr-sheet-ol">
    <li>选范围：先从「平假名 · 清音」开始，熟了再换片假名、浊音和拗音。</li>
    <li>每滴雨里有一个假名。点它的读音，雨滴会化成光，同时读一遍发音。</li>
    <li>雨滴掉进海里会读出正确答案。漏掉 5 滴这一局就结束。</li>
    <li>接住 30 滴就放晴。连击越多得分越高，经验值会记到你的等级里。</li>
    <li>电脑上可以直接打字，shi 和 si、tsu 和 tu 都算对；数字键 1–6 对应 6 个按钮，Esc 暂停。</li>
  </ol>
  <p class="muted small" style="margin:0">也可以去 <a href="kana.html#quiz">五十音测验</a> 做 10 题，或 <a href="downloads.html">下载描红练习纸</a>。</p>
</template>

</main>

  if (!B || !K) return;
  var $ = B.$, $$ = B.$$, esc = B.esc;

  /* ---------- 存储 ----------

  var KEY = 'breeze-game-kana-rain-v1';
  function defaults() { return { mode: 'h-seion', speed: 'mid', sound: true, plays: 0, best: {}, clears: {}, missed: {} }; }
  function load() {

    return d;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
  var S = load();

  /* ---------- 规则 ---------- */
  var TOTAL = 30, LIVES = 5, MAX_ON = 4, SLOTS = 6;
  var MODES = [
    { id: 'h-seion', name: '平假名 · 清音', groups: ['seion'], script: 'h' },

    { id: 'dakuon', name: '浊音 · 半浊音', groups: ['dakuon'], script: 'h' },
